[workspace]
members = ["crates/augur-core"]

[package]
name = "augur-git-tauri"
version = "0.1.0"
description = "Augur Git Tauri desktop application"
authors = ["Lionel Fung", "Li Haozhe"]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
default-run = "augur-git-tauri"

[lib]
name = "augur_git_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "augur-git-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
augur-core = { path = "crates/augur-core" }
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
fontdb = "0.24"
notify = "=8.2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
