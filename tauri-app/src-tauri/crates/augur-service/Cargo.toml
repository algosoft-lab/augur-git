[package]
name = "augur-service"
version = "0.1.0"
description = "Platform-independent Augur Git application service layer"
authors = ["Lionel Fung", "Li Haozhe"]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[dependencies]
augur-core = { path = "../augur-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
notify = "=8.2.0"
tokio = { version = "1", features = ["sync", "rt"] }
# The OS keychain is the only backend used without asking; see
# `credentials::secret` for why the fallbacks are opt-in.
keyring = "4"
