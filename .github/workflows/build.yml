name: Build and publish packages

on:
  push:
    branches:
      - build
      - publish
  workflow_dispatch:

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Check (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            cargo-flags: ""
          - variant: no-ai
            cargo-flags: "--no-default-features"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.variant }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Check build
        run: cargo check --all-targets ${{ matrix.cargo-flags }}

      - name: Test build
        run: cargo test ${{ matrix.cargo-flags }}

  windows:
    name: Windows x86-64 installer (${{ matrix.variant }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            cargo-flags: ""
          - variant: no-ai
            cargo-flags: "--no-default-features"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.variant }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build Windows installer
        run: uv run packaging/build-windows.py ${{ matrix.cargo-flags }}

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path packaging/out -Filter *.exe -File
          if ($null -eq $installer) {
            throw "No Windows installer was produced."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: augur-git-windows-x86-64${{ matrix.variant == 'no-ai' && '-no-ai' || '' }}
          path: packaging/out/*.exe
          if-no-files-found: error

  macos:
    name: macOS arm64 app and DMG (${{ matrix.variant }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            cargo-flags: ""
          - variant: no-ai
            cargo-flags: "--no-default-features"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.variant }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build macOS app and DMG
        run: |
          cargo build --release ${{ matrix.cargo-flags }}
          uv run packaging/build-mac-app.py

      - name: Verify macOS package
        run: |
          test -s packaging/out/*.dmg
          test -x "packaging/out/Augur Git.app/Contents/MacOS/augur-git"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: augur-git-macos-arm64${{ matrix.variant == 'no-ai' && '-no-ai' || '' }}
          path: packaging/out/
          if-no-files-found: error

  linux:
    name: Linux x86-64 AppImage (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            cargo-flags: ""
          - variant: no-ai
            cargo-flags: "--no-default-features"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.variant }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build AppImage
        run: |
          cargo build --release ${{ matrix.cargo-flags }}
          uv run packaging/build-appimage.py

      - name: Verify AppImage
        run: test -s packaging/out/*.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: augur-git-linux-x86-64-appimage${{ matrix.variant == 'no-ai' && '-no-ai' || '' }}
          path: packaging/out/*.AppImage
          if-no-files-found: error

  release:
    name: Publish nightly release
    if: github.ref == 'refs/heads/publish'
    needs:
      - windows
      - macos
      - linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: augur-git-windows-x86-64
          path: staging/windows-full

      - name: Download Windows installer (no-AI)
        uses: actions/download-artifact@v8
        with:
          name: augur-git-windows-x86-64-no-ai
          path: staging/windows-no-ai

      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: augur-git-macos-arm64
          path: staging/macos-full

      - name: Download macOS package (no-AI)
        uses: actions/download-artifact@v8
        with:
          name: augur-git-macos-arm64-no-ai
          path: staging/macos-no-ai

      - name: Download Linux AppImage
        uses: actions/download-artifact@v8
        with:
          name: augur-git-linux-x86-64-appimage
          path: staging/linux-full

      - name: Download Linux AppImage (no-AI)
        uses: actions/download-artifact@v8
        with:
          name: augur-git-linux-x86-64-appimage-no-ai
          path: staging/linux-no-ai

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Each staging directory holds one variant package per platform; the
          # variants build the same file names, so they must stay separated
          # until this rename.
          for staging in windows-full windows-no-ai macos-full macos-no-ai linux-full linux-no-ai; do
            count=$(find "staging/${staging}" -type f | wc -l)
            if (( count != 1 )); then
              echo "Expected exactly one file in staging/${staging}, got ${count}."
              exit 1
            fi
          done

          mkdir -p release-assets
          cp -- staging/windows-full/*.exe release-assets/augur-git-windows-x86-64.exe
          cp -- staging/windows-no-ai/*.exe release-assets/augur-git-windows-x86-64-no-ai.exe
          cp -- staging/macos-full/*.dmg release-assets/augur-git-macos-arm64.dmg
          cp -- staging/macos-no-ai/*.dmg release-assets/augur-git-macos-arm64-no-ai.dmg
          cp -- staging/linux-full/*.AppImage release-assets/augur-git-linux-x86-64.AppImage
          cp -- staging/linux-no-ai/*.AppImage release-assets/augur-git-linux-x86-64-no-ai.AppImage

      - name: Update nightly tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          tag_lookup_ref="repos/${REPOSITORY}/git/ref/tags/nightly"
          tag_update_ref="repos/${REPOSITORY}/git/refs/tags/nightly"
          if gh api "${tag_lookup_ref}" >/dev/null 2>&1; then
            gh api --method PATCH "${tag_update_ref}" \
              -f "sha=${COMMIT_SHA}" \
              -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPOSITORY}/git/refs" \
              -f ref=refs/tags/nightly \
              -f "sha=${COMMIT_SHA}" >/dev/null
          fi

      - name: Replace nightly release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          releases_api="repos/${REPOSITORY}/releases"
          release_id=""
          release_body="Automated nightly build for commit ${COMMIT_SHA}."
          release_body+=$'\n\n## ⚠️ Note for macOS users\n\nBuilds are unsigned (no Apple Developer ID). After dragging Augur Git into Applications, clear the quarantine flag once:\n\n```\nxattr -cr "/Applications/Augur Git.app"\n```'
          release_body+=$'\n\nThe `-no-ai` packages are plain Git GUI builds without the coding-agent integration, embedded terminal, and Lua extension runtime.'
          if release_id="$(gh api "${releases_api}/tags/nightly" --jq '.id' 2>/dev/null)"; then
            gh api --method PATCH "${releases_api}/${release_id}" \
              -f name="Augur Git Nightly" \
              -f "body=${release_body}" \
              -F draft=true \
              -F prerelease=true \
              -f make_latest=false >/dev/null
          else
            release_id="$(gh api --method POST "${releases_api}" \
              -f tag_name=nightly \
              -f name="Augur Git Nightly" \
              -f "body=${release_body}" \
              -F draft=true \
              -F prerelease=true \
              -f make_latest=false \
              --jq '.id')"
          fi

          asset_ids="$(gh api --paginate "${releases_api}/${release_id}/assets?per_page=100" --jq '.[].id')"
          while IFS= read -r asset_id; do
            if [[ -n "${asset_id}" ]]; then
              gh api --method DELETE "${releases_api}/assets/${asset_id}" >/dev/null
            fi
          done <<< "${asset_ids}"

          gh release upload nightly \
            release-assets/augur-git-windows-x86-64.exe \
            release-assets/augur-git-windows-x86-64-no-ai.exe \
            release-assets/augur-git-macos-arm64.dmg \
            release-assets/augur-git-macos-arm64-no-ai.dmg \
            release-assets/augur-git-linux-x86-64.AppImage \
            release-assets/augur-git-linux-x86-64-no-ai.AppImage \
            --repo "${REPOSITORY}" \
            --clobber

          gh api --method PATCH "${releases_api}/${release_id}" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false >/dev/null
