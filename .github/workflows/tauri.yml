name: Build and publish Tauri packages

on:
  push:
    branches:
      - publish-tauri
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  nightly-version:
    name: Resolve nightly version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Derive the run version
        id: version
        shell: bash
        run: |
          version="$(node tauri-app/packaging/nightly-version.mjs "${GITHUB_RUN_NUMBER}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  checks:
    name: Tauri checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Tauri Linux dependencies
        uses: ./.github/actions/install-tauri-linux-deps

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: bun ci

      - name: Type-check frontend
        working-directory: tauri-app
        run: bun run typecheck

      - name: Test frontend
        working-directory: tauri-app
        run: bun run test

      - name: Install Chromium for browser tests
        working-directory: tauri-app
        run: bunx playwright install --with-deps chromium

      - name: Test browser workflows
        working-directory: tauri-app
        run: bun run test:e2e

      - name: Test Rust workspace
        working-directory: tauri-app
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Test nightly release cleanup
        run: bash .github/scripts/prune-tauri-nightly-releases.test.sh

  build-windows:
    name: Windows x86-64 NSIS installer
    needs: nightly-version
    runs-on: windows-2025
    env:
      AUGUR_RELEASE_VERSION: ${{ needs.nightly-version.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-app/src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-tauri-cargo-${{ hashFiles('tauri-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-tauri-cargo-

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: bun ci

      - name: Build signed Windows installer
        working-directory: tauri-app
        run: bun run package:windows

      - name: Upload Windows installer and signature
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tauri-windows-x86_64
          path: |
            tauri-app/packaging/out/augur-git-tauri-windows-x86_64-nsis.exe
            tauri-app/packaging/out/augur-git-tauri-windows-x86_64-nsis.exe.sig
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: macOS ARM64 DMG
    needs: nightly-version
    runs-on: macos-15
    env:
      AUGUR_RELEASE_VERSION: ${{ needs.nightly-version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-app/src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-tauri-cargo-${{ hashFiles('tauri-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-tauri-cargo-

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: bun ci

      - name: Build macOS app and DMG
        working-directory: tauri-app
        run: bun run package:macos

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tauri-macos-arm64
          path: tauri-app/packaging/out/augur-git-tauri-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Linux x86-64 packages
    needs: nightly-version
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      AUGUR_RELEASE_VERSION: ${{ needs.nightly-version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Tauri Linux dependencies
        uses: ./.github/actions/install-tauri-linux-deps

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-app/src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-tauri-cargo-${{ hashFiles('tauri-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-tauri-cargo-

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: bun ci

      - name: Build Linux packages
        working-directory: tauri-app
        run: bun run package:linux

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tauri-linux-x86_64
          path: |
            tauri-app/packaging/out/augur-git-tauri-linux-x86_64.AppImage
            tauri-app/packaging/out/augur-git-tauri-linux-x86_64.deb
            tauri-app/packaging/out/augur-git-tauri-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Tauri nightly release
    if: github.ref == 'refs/heads/publish-tauri'
    needs:
      - nightly-version
      - checks
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-24.04
    concurrency:
      group: tauri-nightly-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
      NIGHTLY_VERSION: ${{ needs.nightly-version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Require Homebrew tap credentials
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: test -n "${TAP_PUSH_TOKEN}"

      - name: Check out Homebrew tap
        uses: actions/checkout@v7.0.1
        with:
          repository: algosoft-lab/homebrew-augur-git
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: homebrew-tap

      - name: Set up Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version: 24

      - name: Download Windows installer and signature
        uses: actions/download-artifact@v8.0.1
        with:
          name: tauri-windows-x86_64
          path: staging/windows

      - name: Download macOS DMG
        uses: actions/download-artifact@v8.0.1
        with:
          name: tauri-macos-arm64
          path: staging/macos

      - name: Download Linux packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: tauri-linux-x86_64
          path: staging/linux

      - name: Prepare and validate immutable release files
        shell: bash
        run: |
          set -euo pipefail
          windows_base="augur-git-tauri-windows-x86_64-nsis"
          macos_base="augur-git-tauri-macos-arm64"
          linux_base="augur-git-tauri-linux-x86_64"

          cp "staging/windows/${windows_base}.exe" "staging/${windows_base}-${NIGHTLY_VERSION}.exe"
          cp "staging/windows/${windows_base}.exe.sig" "staging/${windows_base}-${NIGHTLY_VERSION}.exe.sig"
          cp "staging/macos/${macos_base}.dmg" "staging/${macos_base}-${NIGHTLY_VERSION}.dmg"
          cp "staging/linux/${linux_base}.AppImage" "staging/${linux_base}-${NIGHTLY_VERSION}.AppImage"
          cp "staging/linux/${linux_base}.deb" "staging/${linux_base}-${NIGHTLY_VERSION}.deb"
          cp "staging/linux/${linux_base}.tar.gz" "staging/${linux_base}-${NIGHTLY_VERSION}.tar.gz"

          for file in staging/*-${NIGHTLY_VERSION}.*; do
            test -s "${file}"
          done
          test -s "staging/${windows_base}-${NIGHTLY_VERSION}.exe.sig"

          node tauri-app/packaging/render-updater-manifest.mjs \
            --version "${NIGHTLY_VERSION}" \
            --url "https://github.com/${REPOSITORY}/releases/download/tauri-nightly-${NIGHTLY_VERSION}/${windows_base}-${NIGHTLY_VERSION}.exe" \
            --signature-file "staging/${windows_base}-${NIGHTLY_VERSION}.exe.sig" \
            --out staging/latest.json
          node tauri-app/packaging/render-homebrew-cask.mjs \
            --dmg "staging/${macos_base}-${NIGHTLY_VERSION}.dmg" \
            --version "${NIGHTLY_VERSION}" \
            --out staging/augur-git.rb

          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            const feed = JSON.parse(readFileSync("staging/latest.json", "utf8"));
            if (feed.version !== process.env.NIGHTLY_VERSION) throw new Error("Updater feed version mismatch");
            const platform = feed.platforms?.["windows-x86_64"];
            if (!platform?.url || !platform?.signature) throw new Error("Updater feed lacks installer URL or signature");
            const dmg = readFileSync(`staging/augur-git-tauri-macos-arm64-${process.env.NIGHTLY_VERSION}.dmg`);
            const expectedSha = createHash("sha256").update(dmg).digest("hex");
            const cask = readFileSync("staging/augur-git.rb", "utf8");
            const actualSha = cask.match(/^  sha256 "([a-f0-9]{64})"$/m)?.[1];
            if (actualSha !== expectedSha) throw new Error("Homebrew cask checksum does not match the DMG");
          '
          sha256sum "staging/${macos_base}-${NIGHTLY_VERSION}.dmg"

      - name: Skip stale builds
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          branch_sha="$(gh api "repos/${REPOSITORY}/branches/publish-tauri" --jq '.commit.sha')"
          if [[ "${branch_sha}" != "${COMMIT_SHA}" ]]; then
            echo "This run is stale; publish-tauri now points to ${branch_sha}."
            echo "stale=true" >> "${GITHUB_OUTPUT}"
          else
            echo "stale=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish immutable nightly assets
        if: steps.freshness.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="tauri-nightly-${NIGHTLY_VERSION}"
          notes="Automated Tauri nightly build for commit ${COMMIT_SHA}."
          notes+=$'\nVersion: '
          notes+="${NIGHTLY_VERSION}"
          notes+=$'\n\nThis per-build release holds immutable installers and packages.'
          gh release create "${tag}" \
            "staging/augur-git-tauri-windows-x86_64-nsis-${NIGHTLY_VERSION}.exe" \
            "staging/augur-git-tauri-windows-x86_64-nsis-${NIGHTLY_VERSION}.exe.sig" \
            "staging/augur-git-tauri-macos-arm64-${NIGHTLY_VERSION}.dmg" \
            "staging/augur-git-tauri-linux-x86_64-${NIGHTLY_VERSION}.AppImage" \
            "staging/augur-git-tauri-linux-x86_64-${NIGHTLY_VERSION}.deb" \
            "staging/augur-git-tauri-linux-x86_64-${NIGHTLY_VERSION}.tar.gz" \
            staging/latest.json \
            --repo "${REPOSITORY}" \
            --target "${COMMIT_SHA}" \
            --title "Augur Git Tauri ${NIGHTLY_VERSION}" \
            --notes "${notes}" \
            --prerelease

          expected="$(printf '%s\n' \
            "augur-git-tauri-windows-x86_64-nsis-${NIGHTLY_VERSION}.exe" \
            "augur-git-tauri-windows-x86_64-nsis-${NIGHTLY_VERSION}.exe.sig" \
            "augur-git-tauri-macos-arm64-${NIGHTLY_VERSION}.dmg" \
            "augur-git-tauri-linux-x86_64-${NIGHTLY_VERSION}.AppImage" \
            "augur-git-tauri-linux-x86_64-${NIGHTLY_VERSION}.deb" \
            "augur-git-tauri-linux-x86_64-${NIGHTLY_VERSION}.tar.gz" \
            latest.json | sort)"
          actual="$(gh api "repos/${REPOSITORY}/releases/tags/${tag}" --jq '.assets[].name' | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Immutable release assets do not match the expected set."
            printf 'Expected:\n%s\nActual:\n%s\n' "${expected}" "${actual}"
            exit 1
          fi

      - name: Publish checksum-pinned Homebrew cask
        if: steps.freshness.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Casks
          cp staging/augur-git.rb homebrew-tap/Casks/augur-git.rb
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Casks/augur-git.rb
          if ! git -C homebrew-tap diff --cached --quiet; then
            git -C homebrew-tap commit -m "chore(cask): bump augur-git to ${NIGHTLY_VERSION}"
            git -C homebrew-tap push origin HEAD
          fi

      - name: Advance rolling nightly release
        id: rolling
        if: steps.freshness.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch_sha="$(gh api "repos/${REPOSITORY}/branches/publish-tauri" --jq '.commit.sha')"
          if [[ "${branch_sha}" != "${COMMIT_SHA}" ]]; then
            echo "The branch advanced before the rolling release update; keeping the previous feed."
            exit 0
          fi

          tag="tauri-nightly"
          release_body="Automated Tauri nightly build for commit ${COMMIT_SHA}."
          release_body+=$'\nVersion: '
          release_body+="${NIGHTLY_VERSION}"
          release_body+=$'\n\nThe Linux raw archive requires system GTK 3 and WebKitGTK 4.1 libraries. The macOS app uses an ad-hoc signature and is not notarized.'
          release_id="$(gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name == "tauri-nightly") | .id' | head -n 1)"
          release_created=false

          if [[ -z "${release_id}" ]]; then
            release_id="$(gh api --method POST "repos/${REPOSITORY}/releases" \
              -f tag_name="${tag}" \
              -F "target_commitish=${COMMIT_SHA}" \
              -f name="Augur Git Tauri Nightly" \
              -f "body=${release_body}" \
              -F draft=true \
              -F prerelease=true \
              -f make_latest=false \
              --jq '.id')"
            release_created=true
          fi

          cp staging/windows/augur-git-tauri-windows-x86_64-nsis.exe staging/rolling-windows.exe
          cp staging/windows/augur-git-tauri-windows-x86_64-nsis.exe.sig staging/rolling-windows.exe.sig
          cp staging/macos/augur-git-tauri-macos-arm64.dmg staging/rolling-macos.dmg
          cp staging/linux/augur-git-tauri-linux-x86_64.AppImage staging/rolling-linux.AppImage
          cp staging/linux/augur-git-tauri-linux-x86_64.deb staging/rolling-linux.deb
          cp staging/linux/augur-git-tauri-linux-x86_64.tar.gz staging/rolling-linux.tar.gz
          gh release upload "${tag}" \
            staging/rolling-windows.exe#augur-git-tauri-windows-x86_64-nsis.exe \
            staging/rolling-windows.exe.sig#augur-git-tauri-windows-x86_64-nsis.exe.sig \
            staging/rolling-macos.dmg#augur-git-tauri-macos-arm64.dmg \
            staging/rolling-linux.AppImage#augur-git-tauri-linux-x86_64.AppImage \
            staging/rolling-linux.deb#augur-git-tauri-linux-x86_64.deb \
            staging/rolling-linux.tar.gz#augur-git-tauri-linux-x86_64.tar.gz \
            --repo "${REPOSITORY}" \
            --clobber

          expected_assets="$(printf '%s\n' \
            'rolling-windows.exe|augur-git-tauri-windows-x86_64-nsis.exe' \
            'rolling-windows.exe.sig|augur-git-tauri-windows-x86_64-nsis.exe.sig' \
            'rolling-macos.dmg|augur-git-tauri-macos-arm64.dmg' \
            'rolling-linux.AppImage|augur-git-tauri-linux-x86_64.AppImage' \
            'rolling-linux.deb|augur-git-tauri-linux-x86_64.deb' \
            'rolling-linux.tar.gz|augur-git-tauri-linux-x86_64.tar.gz' | sort)"
          assets_ready=false
          for attempt in {1..10}; do
            listed_assets="$(gh api --paginate "repos/${REPOSITORY}/releases/${release_id}/assets?per_page=100" --jq '.[] | "\(.name)|\(.label // "")"' | sort)"
            missing_assets=""
            while IFS= read -r expected_asset; do
              if ! grep -Fxq -- "${expected_asset}" <<< "${listed_assets}"; then
                missing_assets+="${expected_asset}"$'\n'
              fi
            done <<< "${expected_assets}"

            if [[ -z "${missing_assets}" ]]; then
              assets_ready=true
              break
            fi

            if [[ "${attempt}" -lt 10 ]]; then
              echo "Waiting for rolling release assets to become visible (attempt ${attempt}/10):"
              printf '%s' "${missing_assets}"
              sleep 5
            fi
          done

          if [[ "${assets_ready}" != true ]]; then
            echo "Rolling release is missing assets:"
            printf '%s' "${missing_assets}"
            printf 'Available assets:\n%s\n' "${listed_assets}"
            exit 1
          fi

          branch_sha="$(gh api "repos/${REPOSITORY}/branches/publish-tauri" --jq '.commit.sha')"
          if [[ "${branch_sha}" != "${COMMIT_SHA}" ]]; then
            echo "The branch advanced before the rolling feed update; keeping the previous feed."
            exit 0
          fi

          if [[ "${release_created}" != true ]]; then
            gh api --method PATCH "repos/${REPOSITORY}/releases/${release_id}" \
              -f name="Augur Git Tauri Nightly" \
              -f "body=${release_body}" \
              -F prerelease=true \
              -f make_latest=false >/dev/null
          fi

          tag_lookup_ref="repos/${REPOSITORY}/git/ref/tags/${tag}"
          tag_update_ref="repos/${REPOSITORY}/git/refs/tags/${tag}"
          if gh api "${tag_lookup_ref}" >/dev/null 2>&1; then
            gh api --method PATCH "${tag_update_ref}" -f "sha=${COMMIT_SHA}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${tag}" \
              -f "sha=${COMMIT_SHA}" >/dev/null
          fi

          # Replace the feed last, after every immutable target and rolling alias has been checked.
          gh release upload "${tag}" staging/latest.json --repo "${REPOSITORY}" --clobber

          if [[ "${release_created}" == true ]]; then
            gh api --method PATCH "repos/${REPOSITORY}/releases/${release_id}" \
              -F draft=false \
              -F prerelease=true \
              -f make_latest=false >/dev/null
          fi

          echo "published=true" >> "${GITHUB_OUTPUT}"

      - name: Remove older Tauri nightly releases and tags
        if: steps.rolling.outputs.published == 'true'
        shell: bash
        run: bash .github/scripts/prune-tauri-nightly-releases.sh
