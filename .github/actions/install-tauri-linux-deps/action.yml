name: Install Tauri Linux build dependencies
description: Install the libraries needed to build Tauri bundles on Ubuntu.

runs:
  using: composite
  steps:
    - name: Install Tauri Linux build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          build-essential \
          curl \
          file \
          libayatana-appindicator3-dev \
          libgtk-3-dev \
          librsvg2-dev \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          patchelf \
          pkg-config \
          wget \
          xdg-utils
