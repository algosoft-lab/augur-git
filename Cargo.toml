[package]
name = "augur-git"
version = "0.1.0"
authors = ["Lionel Fung", "Li Haozhe"]
edition = "2024"
description = "Git GUI client built with GPUI"

[dependencies]
similar = { version = "3", features = ["inline"] }
log = "0.4.34"
env_logger = "0.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
chrono = "0.4"
dirs = "6"
alacritty_terminal = "0.26"
mlua = { version = "0.12.1", features = ["lua54", "vendored", "serde", "send"] }
semver = "1"
sha2 = "0.11.0"
toml = "1.1.5"

[dependencies.gpui]
git = "https://github.com/zed-industries/zed"

[dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed"
features = [
    "font-kit",
    "wayland",
    "x11",
]

[dependencies.gpui-component]
git = "https://github.com/longbridge/gpui-component"
features = ["tree-sitter-languages"]

[dependencies.gpui-component-assets]
git = "https://github.com/longbridge/gpui-component"

[build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Diagnostics_Debug",
] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = [
    "test-support",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
